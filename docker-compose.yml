services:
  postgres:
    image: postgres:16-alpine
    container_name: shorturl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shorturl
      POSTGRES_USER: shorturl
      POSTGRES_PASSWORD: shorturl
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - shorturl_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shorturl -d shorturl"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: development
      PORT: 3211
      DATABASE_URL: postgres://shorturl:shorturl@postgres:5432/shorturl
      REDIS_URL: redis://redis:6379
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:${BACKEND_PORT:-3211}}
      SHORT_URL_BASE: ${SHORT_URL_BASE:-}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:${FRONTEND_PORT:-3210}}
      JWT_SECRET: ${JWT_SECRET:-}
    ports:
      - "${BACKEND_PORT:-3211}:3211"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3211/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 10

  frontend:
    profiles:
      - frontend
    build:
      context: .
      dockerfile: Frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3210}:3210"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3210/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  shorturl_postgres_data:
