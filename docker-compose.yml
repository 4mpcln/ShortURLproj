services:
  postgres:
    image: postgres:16-alpine
    container_name: shorturl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shorturl
      POSTGRES_USER: shorturl
      POSTGRES_PASSWORD: shorturl
    ports:
      - "5432:5432"
    volumes:
      - shorturl_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shorturl -d shorturl"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  shorturl_postgres_data:
